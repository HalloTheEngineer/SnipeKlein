<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SnipeKlein - decision panel</title>
<style>
  :root {
    --bg: #10131a; --panel: #171b24; --panel-2: #1e2430; --line: #2a3140;
    --text: #e6e9ef; --muted: #98a2b3; --accent: #6ea8fe;
    --green: #3fb950; --yellow: #d29922; --red: #f85149; --grey: #6e7681;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  header {
    display: flex; align-items: baseline; gap: 12px; padding: 14px 20px;
    border-bottom: 1px solid var(--line); background: var(--panel);
    position: sticky; top: 0; z-index: 5;
  }
  header h1 { font-size: 15px; margin: 0; letter-spacing: .3px; }
  header .sub { color: var(--muted); font-size: 12px; }
  header .spacer { flex: 1; }
  #status { color: var(--muted); font-size: 12px; }
  .cards { display: flex; flex-wrap: wrap; gap: 10px; padding: 14px 20px; }
  .card {
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    padding: 10px 14px; min-width: 130px;
  }
  .card .k { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .6px; }
  .card .v { font-size: 20px; font-weight: 600; }
  .card .x { color: var(--muted); font-size: 11px; }
  .filters {
    display: flex; flex-wrap: wrap; gap: 8px; padding: 0 20px 12px; align-items: center;
  }
  input, select, button {
    background: var(--panel-2); color: var(--text); border: 1px solid var(--line);
    border-radius: 6px; padding: 6px 9px; font: inherit; font-size: 13px;
  }
  input[type=search] { min-width: 260px; }
  button { cursor: pointer; }
  button:hover { border-color: var(--accent); }
  table { width: 100%; border-collapse: collapse; }
  thead th {
    text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .6px;
    color: var(--muted); font-weight: 600; padding: 8px 12px; border-bottom: 1px solid var(--line);
    position: sticky; top: 52px; background: var(--bg);
  }
  tbody td { padding: 8px 12px; border-bottom: 1px solid #1d222c; vertical-align: top; }
  tbody tr { cursor: pointer; }
  tbody tr:hover { background: #171c26; }
  .t { max-width: 520px; }
  .muted { color: var(--muted); }
  .num { text-align: right; white-space: nowrap; }
  .badge {
    display: inline-block; padding: 1px 7px; border-radius: 20px; font-size: 11px;
    font-weight: 600; border: 1px solid transparent;
  }
  .b-rejected { background: #2b2226; color: var(--muted); border-color: #3a2c30; }
  .b-accepted { background: #1f2b22; color: var(--green); border-color: #2b3d2f; }
  .b-alerted  { background: #2a2418; color: var(--yellow); border-color: #3d3524; }
  .b-extreme  { background: #2e1c1c; color: var(--red); border-color: #4a2626; }
  .b-nearmiss { background: #14263d; color: #58a6ff; border-color: #1f3a5c; }
  .b-stage { background: #1b2230; color: var(--accent); border-color: #26334a; }
  #drawer {
    position: fixed; top: 0; right: 0; height: 100%; width: min(680px, 100%);
    background: var(--panel); border-left: 1px solid var(--line); overflow-y: auto;
    transform: translateX(100%); transition: transform .15s ease; z-index: 20;
    padding: 18px 22px 60px;
  }
  #drawer.open { transform: translateX(0); }
  #drawer h2 { font-size: 16px; margin: 0 0 4px; }
  #scrim {
    position: fixed; inset: 0; background: rgba(0,0,0,.45); display: none; z-index: 15;
  }
  #scrim.open { display: block; }
  .trail { list-style: none; padding: 0; margin: 12px 0 22px; }
  .trail li { position: relative; padding: 0 0 14px 22px; border-left: 2px solid var(--line); }
  .trail li:last-child { border-left-color: transparent; }
  .trail li::before {
    content: ""; position: absolute; left: -6px; top: 3px; width: 10px; height: 10px;
    border-radius: 50%; background: var(--grey);
  }
  .trail li.passed::before { background: var(--green); }
  .trail li.rejected::before { background: var(--red); }
  .trail li.error::before { background: var(--yellow); }
  .trail .stage { font-weight: 600; }
  .trail .why { color: var(--muted); font-size: 12px; }
  .kv { display: grid; grid-template-columns: 150px 1fr; gap: 3px 10px; margin: 6px 0 16px; }
  .kv dt { color: var(--muted); font-size: 12px; }
  .kv dd { margin: 0; word-break: break-word; }
  h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .7px; color: var(--muted);
       margin: 18px 0 6px; border-bottom: 1px solid var(--line); padding-bottom: 5px; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
  .pre { white-space: pre-wrap; word-break: break-word; color: #c9d1d9; font-size: 12px;
         background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 8px; }
  a { color: var(--accent); }
  .pager { display: flex; gap: 8px; align-items: center; padding: 12px 20px; color: var(--muted); }
  .tabs { display: flex; gap: 4px; padding: 10px 20px 0; }
  .tab {
    background: transparent; border: 1px solid transparent; border-bottom: none;
    color: var(--muted); padding: 7px 14px; border-radius: 6px 6px 0 0; cursor: pointer;
  }
  .tab.active { background: var(--panel); border-color: var(--line); color: var(--text); }
  .b-market { background: #12291f; color: var(--green); border-color: #1f3d2c; }
  .b-estimate { background: #26221a; color: #d29922; border-color: #3d3524; }
  .b-kind { background: #1b2230; color: #a5b4fc; border-color: #26334a; }
  .chip {
    display: inline-block; padding: 1px 7px; border-radius: 5px; margin: 0 4px 4px 0;
    background: var(--panel-2); border: 1px solid var(--line); color: var(--muted);
    font-family: ui-monospace, monospace; font-size: 11px;
  }
  .hist { display: flex; align-items: flex-end; gap: 3px; height: 90px; margin: 8px 0 22px; }
  .hist .bar { flex: 1; background: #2f4a6b; border-radius: 2px 2px 0 0; position: relative; }
  .hist .bar.mark { background: var(--accent); }
  .hist .bar span {
    position: absolute; bottom: -16px; left: 0; right: 0; text-align: center;
    font-size: 9px; color: var(--muted);
  }
  .spark { display: flex; align-items: flex-end; gap: 3px; height: 60px; margin: 8px 0 4px; }
  .spark .bar { flex: 1; background: #2f4a6b; border-radius: 2px 2px 0 0; }
  .spark .bar.last { background: var(--accent); }
  table.mini { font-size: 12px; margin-top: 6px; }
  table.mini th, table.mini td { padding: 3px 8px; }
</style>
</head>
<body>
<header>
  <h1>SnipeKlein</h1>
  <span class="sub">decision panel</span>
  <span class="spacer"></span>
  <span id="status">loading…</span>
</header>

<nav class="tabs">
  <button class="tab active" data-view="listings">Listings</button>
  <button class="tab" data-view="prices">Prices</button>
</nav>

<div class="cards" id="cards"></div>

<div class="filters" id="filters-listings">
  <input type="search" id="q" placeholder="search title, id, location…">
  <select id="outcome">
    <option value="">any outcome</option>
    <option value="rejected">rejected</option>
    <option value="accepted">accepted</option>
    <option value="alerted">alerted</option>
    <option value="near_miss">near miss</option>
    <option value="not_target">not a DDR5 target</option>
  </select>
  <select id="stage">
    <option value="">any stage</option>
    <option value="prefilter">prefilter</option>
    <option value="triage">triage</option>
    <option value="detail">detail</option>
    <option value="extraction">extraction</option>
    <option value="valuation">valuation</option>
    <option value="alert">alert</option>
  </select>
  <select id="query_tag"><option value="">any query</option></select>
  <select id="hours">
    <option value="0">all time</option>
    <option value="1">last hour</option>
    <option value="24">last 24 h</option>
    <option value="168">last 7 days</option>
  </select>
  <select id="order">
    <option value="updated">newest decision</option>
    <option value="first">newest listing</option>
  </select>
  <button id="reload">reload</button>
</div>

<div id="view-listings">
  <table>
    <thead>
      <tr>
        <th>listing</th>
        <th class="num">price</th>
        <th>outcome</th>
        <th>stage</th>
        <th>reason</th>
        <th>seen</th>
      </tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>

  <div class="pager">
    <button id="prev">← newer</button>
    <span id="pageinfo"></span>
    <button id="next">older →</button>
  </div>
</div>

<div id="view-prices" hidden>
  <div class="filters">
    <input type="search" id="pq" placeholder="search component, id, alias…">
    <select id="pkind">
      <option value="">any kind</option>
      <option value="cpu">cpu</option>
      <option value="gpu">gpu</option>
      <option value="ram">ram</option>
      <option value="storage">storage</option>
      <option value="board">board</option>
      <option value="psu">psu</option>
      <option value="peripheral">peripheral</option>
    </select>
    <select id="psource">
      <option value="">any source</option>
      <option value="market">market measured</option>
      <option value="estimate">estimate only</option>
    </select>
    <select id="psort">
      <option value="kind">sort: kind</option>
      <option value="value">sort: value</option>
      <option value="name">sort: name</option>
      <option value="updated">sort: last update</option>
    </select>
  </div>
  <table>
    <thead>
      <tr>
        <th>component</th>
        <th>kind</th>
        <th class="num">FMV</th>
        <th>source</th>
        <th class="num">samples</th>
        <th>updated</th>
      </tr>
    </thead>
    <tbody id="price-rows"></tbody>
  </table>
  <div class="pager"><span id="price-info"></span></div>
</div>

<div id="scrim"></div>
<aside id="drawer"><div class="muted">select a listing…</div></aside>

<script src="/app.js"></script>
</body>
</html>
