# SnipeKlein - Kleinanzeigen deal sniper.
#
# Deployment notes (Dokploy / any docker compose host):
#   * Secrets are NOT read from a file. Every value comes from the environment:
#     GEMINI_API_KEY, DISCORD_WEBHOOK_URL and (optional) PROXY_URL.
#     Locally they are taken from the ./.env file (docker compose loads it
#     automatically), on a server they are injected by the platform
#     (Dokploy writes them into the .env next to this file and passes
#     --env-file).
#   * The state (SQLite database, harvested prices) lives in the named volume
#     "snipeklein-data" - it survives redeploys and can be snapshotted by
#     Dokploy's Volume Backups.
#   * No ports are exposed: this is a worker, it only talks to
#     kleinanzeigen.de, the Gemini API and the Discord webhook.

x-snipeklein: &snipeklein
  build: .
  image: snipeklein:latest
  restart: unless-stopped
  environment:
    TZ: Europe/Berlin
    GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
    DISCORD_WEBHOOK_URL: "${DISCORD_WEBHOOK_URL:-}"
    # Optional German/EU residential proxy (see spec 3.1)
    PROXY_URL: "${PROXY_URL:-}"
  volumes:
    - snipeklein-data:/app/data
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:
  bot:
    <<: *snipeklein
    container_name: snipeklein-bot
    command: ["poll"]
    healthcheck:
      test: ["CMD", "snipeklein", "health"]
      interval: 5m
      timeout: 30s
      retries: 3
      start_period: 30s

  watchdog:
    <<: *snipeklein
    container_name: snipeklein-watchdog
    command: ["watchdog"]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  panel:
    <<: *snipeklein
    container_name: snipeklein-panel
    # Read-only decision panel. Bind to 0.0.0.0 so Traefik/Dokploy can reach
    # it; the service refuses to start without PANEL_USER/PANEL_PASSWORD.
    command: ["panel", "--host", "0.0.0.0", "--port", "8137"]
    environment:
      TZ: Europe/Berlin
      PANEL_USER: "${PANEL_USER:-}"
      PANEL_PASSWORD: "${PANEL_PASSWORD:-}"
    healthcheck:
      test: ["CMD", "snipeklein", "panel", "--check"]
      interval: 5m
      timeout: 30s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  price-refresher:
    <<: *snipeklein
    container_name: snipeklein-prices
    # Refresh the FMV table once a day at 03:00 (server local time, TZ is set
    # to Europe/Berlin above) and write a consistent backup afterwards.
    command: ["prices", "refresh", "--daily-at", "03:00", "--backup"]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  snipeklein-data:
