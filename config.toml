# SnipeKlein configuration (non-secret).
# Secrets live in .env (see .env.example).

[general]
timezone = "Europe/Berlin"
db_path = "data/snipeklein.db"
log_level = "INFO"
# Retention for the seen-id store (spec 3.3)
seen_ttl_days = 30

[ingestion]
base_url = "https://www.kleinanzeigen.de"
impersonate = "chrome131"
user_agent = "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"
accept_language = "de-DE,de;q=0.9"
request_timeout_s = 30
max_retries = 3
# Global politeness: minimum seconds between two HTTP requests to the site.
min_request_interval_s = 2.0
# Randomized poll cadence (spec 3.2)
poll_interval_min_s = 45
poll_interval_max_s = 85
# Optional EU/German residential proxy (spec 3.1)
proxy_url = ""

[[queries]]
tag = "pc-gaming-ddr5"
category = "pcs"
category_id = 228
# "ddr5" is not a luxury keyword: the site indexes the description, so it
# surfaces the DDR5 systems whose title only says "Gaming PC" - the generic
# "gaming pc" search buries them (25 of 27 results are new).
# The site indexes the description, so every keyword is a different slice of
# the market: the "ddr5"/"am5"/model keywords reach the listings whose
# specifications are in the body and not in the title.
keywords = ["gaming pc", "gaming pc ddr5", "ddr5", "ddr5 pc", "am5 gaming pc",
           "7800x3d pc", "rtx 4070", "rtx 4070 ti pc", "rtx 4080", "5070 gaming pc"]
min_price = 300
max_price = 1800
max_pages = 1

[[queries]]
tag = "pc-complettsystem"
category = "pcs"
category_id = 228
keywords = ["pc komplett", "komplett pc", "gaming pc komplett", "am5"]
min_price = 300
max_price = 2000
max_pages = 1

[[queries]]
tag = "gpu-rtx40"
category = "grafikkarten"
category_id = 225
keywords = ["rtx 4070", "rtx 4080", "rtx 4070 super"]
min_price = 200
max_price = 900
max_pages = 1

[filters]
# Hard requirement of the current target profile.
required_ram_generation = "DDR5"
# Coarse margin (in percent) that a listing must reach in the cheap triage
# stage before we spend a detail fetch + an LLM call on it.
triage_min_margin_pct = 15.0
# Minimum number of recognized components for the triage stage.
triage_min_components = 2
# If the title hints at a current generation platform (RTX 40/50, AM5, Ryzen
# 7000/9000, 12th gen+ Intel, "DDR5") but the price table does not know the
# model, the ad still goes to the extraction: the description is where the
# specification usually is.  Set to false to keep the LLM volume minimal.
modern_platform_tier = true
# Stale listings (often already sold) are valued but never alerted.
max_alert_age_days = 14

[storage]
# Retention for the local database (pruned by `snipeklein prune` and by the
# poll loop).
observation_retention_days = 30
listing_retention_days = 30

[valuation]
min_coverage = 0.75
# A fair price is within ~10 % of the sum of a system's parts (measured on the
# used market), so the bands follow that spread.
actionable_margin_min_pct = 12.0
actionable_margin_max_pct = 30.0
extreme_margin_pct = 30.0
# Listings between this margin and the actionable band are reported as a
# "near miss" (blue, clearly not a deal).
near_miss_margin_min_pct = 5.0
near_miss_alerts = true
# The market asks a multiple of the sum of a system's parts.  It is calibrated
# from the observed system market (prices market), not guessed.
assembly_fallback = 1.0
assembly_min_samples = 8
assembly_window_days = 14
asking_to_sold_factor = 0.92
min_price_samples = 5

[llm]
provider = "gemini"
model = "gemini-3.5-flash-lite"
fallback_model = "gemini-3.1-flash-lite"
base_url = ""
api_key_env = "GEMINI_API_KEY"
thinking_level = "minimal"
max_rpm = 6
max_attempts = 4
timeout_s = 30
# Keep the system prompt + schema cached server-side (context caching).
enable_context_cache = true

[notify]
webhook_url_env = "DISCORD_WEBHOOK_URL"
username = "SnipeKlein"
# Re-send an alert when the computed payload changed (e.g. refreshed FMV table).
repeat_on_change = false

[panel]
# Read-only web panel. The credentials come from the environment
# (PANEL_USER / PANEL_PASSWORD), never from this file.
host = "127.0.0.1"
port = 8137
# How long the decision trail is kept.
decision_retention_days = 14
max_decision_rows = 100000

[watchdog]
# Failure watchdog: how often the bot is checked and when Discord is told.
# The grace period covers the first (slow) poll cycle, so a fresh deployment
# never produces a false alarm.
interval = 300       # seconds between checks
grace = 600         # seconds without alarming after the watchdog started
failures = 3        # consecutive failed checks before an alarm
cooldown = 21600    # seconds between repeated alarms (6 h)

[risk]
account_new_days = 30
account_very_new_days = 90
max_active_ads = 10
